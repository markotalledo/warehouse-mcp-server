[project]
name = "warehouse-mcp-server"
version = "0.1.0"
description = "Read-only MCP server over a SQL warehouse: SELECT-only guard, EXPLAIN pre-flight, row caps, PII pseudonymization, audit log, and evals."
requires-python = ">=3.12"
dependencies = ["mcp>=2.3,<3", "duckdb>=1.1", "sqlglot>=25", "pyyaml>=6", "numpy>=1.26"]

[project.scripts]
warehouse-mcp = "warehouse_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
eval = ["anthropic>=0.60"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warehouse_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
